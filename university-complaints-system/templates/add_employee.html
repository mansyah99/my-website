<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة موظف جديد</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="main-navbar">
        <div class="navbar-brand">منصة إدارة الشكاوى</div>

        <button class="nav-toggle" type="button" onclick="toggleNavbar()" id="navToggleBtn">
            <i class="fa-solid fa-bars" id="navToggleIcon"></i>
        </button>

        <div class="navbar-links" id="navbarLinks">
            <a href="/admin">لوحة الأدمن</a>
            <a href="/view_employees">الموظفون</a>
            <a href="/logout" class="logout-link">تسجيل الخروج</a>
        </div>
    </nav>

    <div class="page-container add-employee-page">
        <div class="page-header">
            <h1>إضافة موظف جديد</h1>
            <p class="page-subtitle">أدخل بيانات الموظف واربطه بالقسم الأساسي والجهة الفرعية المناسبة</p>
        </div>

        <div class="card form-card add-employee-form-card">
            <form method="POST">
                <div class="form-group">
                    <label for="full_name">الاسم الكامل</label>
                    <input type="text" id="full_name" name="full_name" required>
                </div>

                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="department_id">القسم الأساسي</label>
                    <select name="department_id" id="department_id" required>
                        {% for department in departments %}
                            <option value="{{ department.department_id }}">
                                {{ department.department_name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="unit_id">الوحدة / الجهة الفرعية</label>
                    <select name="unit_id" id="unit_id" required>
                        {% for unit in units %}
                            <option value="{{ unit.unit_id }}" data-department="{{ unit.base_department_id }}">
                                {{ unit.unit_name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="actions-row" style="margin-top: 18px;">
                    <button type="submit" class="btn btn-primary">إضافة الموظف</button>
                </div>
            </form>
        </div>

        {% if message %}
            <div class="card-soft center-text add-employee-message-box">
                <p style="font-weight: 700;">{{ message }}</p>
            </div>
        {% endif %}
    </div>

    <script>
        function toggleNavbar() {
            const navLinks = document.getElementById("navbarLinks");
            const navIcon = document.getElementById("navToggleIcon");

            navLinks.classList.toggle("show");

            if (navLinks.classList.contains("show")) {
                navIcon.classList.remove("fa-bars");
                navIcon.classList.add("fa-xmark");
            } else {
                navIcon.classList.remove("fa-xmark");
                navIcon.classList.add("fa-bars");
            }
        }

        let lastScrollTop = 0;
        const navbar = document.querySelector(".main-navbar");

        window.addEventListener("scroll", function () {
            let currentScroll = window.pageYOffset || document.documentElement.scrollTop;

            if (navbar) {
                if (currentScroll > lastScrollTop && currentScroll > 80) {
                    navbar.classList.add("navbar-hidden");
                } else {
                    navbar.classList.remove("navbar-hidden");
                }
            }

            lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
        });

        const departmentSelect = document.getElementById("department_id");
        const unitSelect = document.getElementById("unit_id");
        const allUnitOptions = Array.from(unitSelect.querySelectorAll("option"));

        function filterUnitsByDepartment() {
            const selectedDepartment = departmentSelect.value;

            unitSelect.innerHTML = "";

            const matchedOptions = allUnitOptions.filter(option => {
                return option.dataset.department === selectedDepartment;
            });

            matchedOptions.forEach(option => {
                unitSelect.appendChild(option.cloneNode(true));
            });

            if (unitSelect.options.length > 0) {
                unitSelect.selectedIndex = 0;
            }
        }

        departmentSelect.addEventListener("change", filterUnitsByDepartment);
        window.addEventListener("load", filterUnitsByDepartment);
    </script>

</body>
</html>
