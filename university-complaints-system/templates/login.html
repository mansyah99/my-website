<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة إدارة الشكاوى</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="page-container">
        <div class="page-header">
            <h1 class="icon-title"> منصة إدارة الشكاوى</h1>
            <p class="page-subtitle">نظام إلكتروني لمتابعة الشكاوى الجامعية ومعالجتها بشكل منظم وحديث</p>
        </div>

        <div class="card form-card">
            <div class="center-text" style="margin-bottom: 18px;">
                <h2 class="icon-title" style="justify-content: center;"><i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول</h2>
            </div>

            <form method="POST">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" placeholder="أدخل بريدك الإلكتروني" required>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fa-solid fa-arrow-left-to-bracket"></i>
                        تسجيل الدخول
                    </button>
                </div>
            </form>

            {% if message %}
                <div class="card-soft center-text" style="margin-top: 14px;">
                    <p style="color: var(--color-danger); font-weight: 700;">{{ message }}</p>
                </div>
            {% endif %}

            <hr class="soft">

            <div class="links-list">
                <a class="nav-link" href="/register">
                   
                    إنشاء حساب 
                </a>
            </div>
        </div>
    </div>

</body>
</html>
