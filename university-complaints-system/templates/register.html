<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="page-container">
        <div class="page-header">
            <h1>إنشاء حساب</h1>
            <p class="page-subtitle">أنشئ حسابك للوصول إلى خدمات المنصة وتقديم الشكاوى ومتابعتها</p>
        </div>

        <div class="card form-card">
            <div class="center-text" style="margin-bottom: 18px;">
                <h2 style="justify-content: center;">بيانات التسجيل</h2>
            </div>

            <form method="POST">
                <div class="form-group">
                    <label for="full_name">الاسم الكامل</label>
                    <input type="text" id="full_name" name="full_name" placeholder="أدخل اسمك الكامل" required>
                </div>

                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" placeholder="أدخل بريدك الإلكتروني" required>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required>
                </div>

                <div class="form-group">
                    <label for="university_number">الرقم الجامعي</label>
                    <input type="text" id="university_number" name="university_number" placeholder="أدخل الرقم الجامعي" required>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        إنشاء الحساب
                    </button>
                </div>
            </form>

            {% if message %}
                <div class="card-soft center-text" style="margin-top: 14px;">
                    <p style="color: var(--color-danger); font-weight: 700;">{{ message }}</p>
                </div>
            {% endif %}

            <hr class="soft">

            <div class="center-text">
                <p>لديك حساب بالفعل؟ <a href="/login">تسجيل الدخول</a></p>
            </div>
        </div>
    </div>

</body>
</html>
