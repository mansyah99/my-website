<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل القسم</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="main-navbar">
        <div class="navbar-brand">منصة إدارة الشكاوى</div>

        <button class="nav-toggle" type="button" onclick="toggleNavbar()" id="navToggleBtn">
            <i class="fa-solid fa-bars" id="navToggleIcon"></i>
        </button>

        <div class="navbar-links" id="navbarLinks">
            <a href="/admin">لوحة الأدمن</a>
            <a href="/manage_departments">إدارة الأقسام</a>
            <a href="/logout" class="logout-link">تسجيل الخروج</a>
        </div>
    </nav>

    <div class="page-container edit-department-page">
        <div class="page-header">
            <h1>تعديل القسم</h1>
            <p class="page-subtitle">يمكنك تعديل اسم القسم ومراحل المعالجة ومدة المعالجة المتوقعة</p>
        </div>

        <div class="card form-card edit-department-form-card">
            <form method="POST">
                <div class="form-group">
                    <label>اسم القسم</label>
                    <input type="text" name="department_name" value="{{ department.department_name }}" required>
                </div>

                <div class="form-group">
                    <label>المرحلة الأولى</label>
                    <input type="text" name="stage1_name" value="{{ stage1 }}" required>
                </div>

                <div class="form-group">
                    <label>المرحلة الثانية</label>
                    <input type="text" name="stage2_name" value="{{ stage2 }}" required>
                </div>

                <div class="form-group">
                    <label>المرحلة الثالثة</label>
                    <input type="text" name="stage3_name" value="{{ stage3 }}" required>
                </div>

                <div class="form-group">
                    <label>مدة المعالجة المتوقعة بالأيام</label>
                    <input type="number" name="sla_days" min="1" value="{{ department.sla_days }}" required>
                </div>

                <div class="actions-row" style="margin-top: 18px;">
                    <button type="submit" class="btn btn-primary">حفظ التعديلات</button>
                </div>
            </form>
        </div>

        {% if message %}
            <div class="card-soft center-text edit-department-message-box">
                <p style="font-weight: 700;">{{ message }}</p>
            </div>
        {% endif %}
    </div>

    <script>
        function toggleNavbar() {
            const navLinks = document.getElementById("navbarLinks");
            const navIcon = document.getElementById("navToggleIcon");

            navLinks.classList.toggle("show");

            if (navLinks.classList.contains("show")) {
                navIcon.classList.remove("fa-bars");
                navIcon.classList.add("fa-xmark");
            } else {
                navIcon.classList.remove("fa-xmark");
                navIcon.classList.add("fa-bars");
            }
        }

        let lastScrollTop = 0;
        const navbar = document.querySelector(".main-navbar");

        window.addEventListener("scroll", function () {
            let currentScroll = window.pageYOffset || document.documentElement.scrollTop;

            if (navbar) {
                if (currentScroll > lastScrollTop && currentScroll > 80) {
                    navbar.classList.add("navbar-hidden");
                } else {
                    navbar.classList.remove("navbar-hidden");
                }
            }

            lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
        });
    </script>

</body>
</html>
